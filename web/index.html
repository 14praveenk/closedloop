  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #252525;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    #splash-loader {
      position: absolute;
      top: calc(50% + 92px);
      left: 50%;
      width: min(160px, 42vw);
      transform: translateX(-50%);
    }

    .splash-spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 18px;
      border: 3px solid rgba(255, 255, 255, 0.22);
      border-top-color: #ffd51f;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }

    .splash-progress {
      position: relative;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
    }

    .splash-progress::after {
      position: absolute;
      inset: 0;
      width: 45%;
      border-radius: inherit;
      background: #ffd51f;
      content: "";
      animation: splash-progress 1.25s ease-in-out infinite;
    }

    @keyframes splash-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes splash-progress {
      0% {
        transform: translateX(-120%);
      }

      55% {
        transform: translateX(95%);
      }

      100% {
        transform: translateX(240%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-spinner,
      .splash-progress::after {
        animation: none;
      }
    }

    .store-prompt {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 16px;
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 12px;
      max-width: 420px;
      margin: 0 auto;
      padding: 10px 10px 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(24, 24, 24, 0.94);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
      color: #ffffff;
      font-family: Inter, Arial, sans-serif;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 180ms ease, transform 180ms ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .store-prompt.is-visible {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    .store-prompt__icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 10px;
    }

    .store-prompt__copy {
      min-width: 0;
      flex: 1;
      line-height: 1.2;
    }

    .store-prompt__title {
      display: block;
      overflow: hidden;
      font-size: 14px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .store-prompt__text {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.68);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .store-prompt__action {
      flex: 0 0 auto;
      padding: 8px 11px;
      border-radius: 999px;
      background: #ffd51f;
      color: #111111;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .store-prompt__close {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.76);
      cursor: pointer;
      font-size: 20px;
      line-height: 30px;
    }

    @media (min-width: 700px) {
      .store-prompt {
        right: 20px;
        left: auto;
        margin: 0;
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-loader")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <div id="splash-loader" aria-label="Loading" role="status">
    <div class="splash-spinner" aria-hidden="true"></div>
    <div class="splash-progress" aria-hidden="true"></div>
  </div>
  <aside class="store-prompt" id="android-store-prompt" aria-label="Install REVIVE app">
    <img class="store-prompt__icon" src="icons/revive-icon-192.png" alt="">
    <span class="store-prompt__copy">
      <span class="store-prompt__title">REVIVE is on Google Play</span>
      <span class="store-prompt__text">Install the Android app</span>
    </span>
    <a class="store-prompt__action" href="https://play.google.com/store/apps/details?id=com.previva.revive" rel="noopener">Get</a>
    <button class="store-prompt__close" type="button" aria-label="Dismiss">&times;</button>
  </aside>
  <script src="flutter_bootstrap.js" async=""></script>

<!-- Capture PWA install prompt event -->
<script>
  let deferredPrompt;
  const isAndroidBrowser = /Android/i.test(navigator.userAgent || '')
    && !window.matchMedia('(display-mode: standalone)').matches
    && !document.referrer.startsWith('android-app://');

  function showAndroidStorePrompt() {
    if (!isAndroidBrowser || localStorage.getItem('revivePlayPromptDismissed') === 'true') return;
    const prompt = document.getElementById('android-store-prompt');
    if (!prompt) return;
    prompt.querySelector('.store-prompt__close')?.addEventListener('click', () => {
      localStorage.setItem('revivePlayPromptDismissed', 'true');
      prompt.classList.remove('is-visible');
    }, { once: true });
    prompt.querySelector('.store-prompt__action')?.addEventListener('click', () => {
      localStorage.setItem('revivePlayPromptDismissed', 'true');
    }, { once: true });
    window.setTimeout(() => prompt.classList.add('is-visible'), 900);
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    if (isAndroidBrowser) {
      e.preventDefault();
      showAndroidStorePrompt();
      return;
    }
    deferredPrompt = e;
    window.hasPrompt?.();
  });

  async function promptInstall(){
    if (!deferredPrompt) return;
    const promptEvent = deferredPrompt;
    deferredPrompt = null;
    await promptEvent.prompt();
  }

  // Listen for app install event
  window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    window.appInstalled?.();
  });

  window.addEventListener('load', showAndroidStorePrompt);

  // Track how PWA was launched (either from browser or as PWA)
  function getLaunchMode() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
    if(deferredPrompt) window.hasPrompt?.();
    if (document.referrer.startsWith('android-app://')) {
      window.appLaunchedAsTWA?.();
    } else if (navigator.standalone || isStandalone) {
      window.appLaunchedAsPWA?.();
    } else {
      window.appLaunchedInBrowser?.();
    }
  }
</script>
</body></html>
